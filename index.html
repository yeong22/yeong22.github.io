<style>

    --side:#f6f3ee; --side-line:#e6e0d6; --bg:#ffffff;

  html{scroll-behavior:smooth;}

  a:hover{text-decoration:underline;text-underline-offset:2px;}
  b,strong{color:var(--ink);font-weight:600;}

  /* sidebar */
  aside{position:fixed;inset:0 auto 0 0;width:300px;background:var(--side);border-right:1px solid var(--side-line);
        overflow-y:auto;padding:44px 26px 30px;}
  .avatar{width:150px;height:150px;border-radius:50%;overflow:hidden;margin:0 auto 16px;border:3px solid #fff;
          box-shadow:0 2px 10px rgba(0,0,0,.08);background:#ddd;}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .who{text-align:center;}
  .who h1{margin:0;font-size:22px;color:var(--ink);font-weight:700;letter-spacing:-.2px;}
  .who .pos{font-style:italic;color:var(--muted);font-size:14px;margin-top:2px;}
  .who .aff{font-weight:600;color:var(--body);font-size:13.5px;margin-top:4px;}
  .who .topic{font-size:13.5px;margin:16px 0 0;}
  .icons{display:flex;justify-content:center;gap:8px;margin:18px 0 16px;}
  .icons a{width:34px;height:34px;border:1px solid var(--side-line);border-radius:8px;background:#fff;display:grid;place-items:center;}
  .icons a:hover{border-color:var(--btn);text-decoration:none;}
  .icons svg{width:16px;height:16px;fill:var(--btn);}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:9px 12px;border-radius:7px;
       font-weight:600;font-size:13.5px;margin-bottom:8px;}
  .btn svg{width:15px;height:15px;}
  .btn.dark{background:var(--btn);color:var(--btn-ink);} .btn.dark svg{fill:#fff;}
  .btn.light{background:#fff;color:var(--btn);border:1px solid var(--side-line);} .btn.light svg{fill:var(--btn);}
  .btn:hover{text-decoration:none;filter:brightness(1.06);}
  .status{margin:14px 0 0;padding:9px 11px;border-radius:7px;background:#fff;border:1px dashed var(--btn);font-size:12.5px;text-align:center;}
  .side-h{font-size:11.5px;font-weight:700;letter-spacing:1.2px;color:var(--ink);margin:26px 0 10px;border-top:1px solid var(--side-line);padding-top:18px;}
  .edu{margin:0 0 12px;}
  .edu .d{font-weight:600;color:var(--ink);font-size:13px;line-height:1.4;}
  .edu .o{font-size:12.5px;} .edu .w{font-size:12px;color:var(--muted);}
  nav.toc{margin-top:8px;font-size:13px;line-height:2;}
  nav.toc a{color:var(--body);}

  /* main */
  main{margin-left:300px;padding:52px 56px 80px;max-width:1040px;}
  section{margin-bottom:46px;}
  h2{display:flex;align-items:center;gap:14px;font-size:21px;color:var(--ink);margin:0 0 18px;font-weight:700;}
  h2::after{content:"";flex:1;height:1px;background:var(--line);}
  p{margin:0 0 12px;}
  .callout{background:var(--accent-soft);border-radius:8px;padding:12px 16px;color:var(--ink);font-size:14.5px;}
  .meta-row{display:flex;flex-wrap:wrap;gap:18px;margin-top:12px;font-size:13.5px;color:var(--muted);}

  .news .dt{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;padding-top:2px;}

  .tl{position:relative;margin:0;padding:0 0 0 22px;list-style:none;}
  .tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line);}
  .tl li{position:relative;margin:0 0 20px;}
  .tl li::before{content:"";position:absolute;left:-22px;top:6px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--btn);}
  .tl .when{font-size:11.5px;font-weight:600;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;}
  .tl .org{font-weight:700;color:var(--ink);}
  .tl .pos{font-size:14px;}
  .tl .note{font-size:13.5px;color:var(--muted);}

                background:#fff;color:var(--body);cursor:pointer;}
  .chips button.on{background:var(--btn);color:#fff;border-color:var(--btn);}
  .pub{display:grid;grid-template-columns:190px 1fr;gap:20px;padding:16px;border:1px solid var(--line);border-radius:10px;
       margin-bottom:14px;background:#fff;transition:box-shadow .2s;}
  .pub:hover{box-shadow:0 4px 16px rgba(0,0,0,.06);}
  .thumb{border-radius:6px;overflow:hidden;background:var(--chip);display:grid;place-items:center;min-height:96px;}
  .thumb.has-img{background:#fff;border:1px solid var(--line);}
  .thumb img{width:100%;height:100%;max-height:130px;object-fit:contain;background:#fff;display:block;}
  .thumb span{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--muted);text-align:center;padding:10px;}
  .pub h3{margin:0 0 6px;font-size:15.5px;line-height:1.4;color:var(--ink);}
  .venue{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.4px;background:var(--chip);color:var(--btn);
         border-radius:5px;padding:2px 8px;margin-bottom:6px;}
  .authors{font-size:13.5px;}
  .authors .me{font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:2px;}
  .desc{font-size:13.5px;color:var(--body);margin-top:4px;}
  .links{margin-top:8px;display:flex;flex-wrap:wrap;gap:12px;font-size:13px;font-weight:600;}
  .note-eq{font-size:12.5px;color:var(--muted);margin:-8px 0 14px;}

  .list{list-style:none;margin:0;padding:0;}

  .list .h{font-weight:600;color:var(--ink);} .list .m{font-size:13.5px;}
  footer{margin-left:300px;padding:22px 56px 40px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);}

  .reveal{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease;}
  .reveal.in{opacity:1;transform:none;}
  .top{position:fixed;right:22px;bottom:22px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
       background:#fff;display:grid;place-items:center;color:var(--btn);font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .top:hover{text-decoration:none;}

  @media (max-width: 900px){
    aside{position:static;width:auto;border-right:none;border-bottom:1px solid var(--side-line);padding:32px 22px;}
    main,footer{margin-left:0;padding:32px 20px;}
    .pub{grid-template-columns:1fr;}
    .news li{grid-template-columns:76px 1fr;}
  }
  @media (prefers-reduced-motion: reduce){ .reveal{opacity:1;transform:none;transition:none;} html{scroll-behavior:auto;} }
</style>

const pubCard = p => `
  <article class="pub reveal" data-cat="${p.cat}">
    <div class="thumb${p.img ? " has-img" : ""}">${p.img ? `<img src="${p.img}" alt="" loading="lazy">` : `<span>${p.thumb || ""}</span>`}</div>
    <div>
      <h3>${p.title}</h3>
      <div class="venue">${p.venue}</div>
      <div class="authors">${me(p.authors)}</div>
      ${p.desc ? `<div class="desc">${p.desc}</div>` : ""}
      ${p.links ? `<div class="links">${p.links.map(l => `<a href="${l.u}"${ext(l.u)}>${l.l}</a>`).join("")}</div>` : ""}
    </div>
  </article>`;
const list = items => `<ul class="list">${items.map(i => `<li class="reveal"><div class="h">${i.h}</div><div class="m">${i.m}</div></li>`).join("")}</ul>`;

document.getElementById("main").innerHTML = `
  <section id="about" class="reveal"><h2>About Me</h2>
    ${SITE.about.map(p => `<p>${p}</p>`).join("")}
    <p class="callout">${SITE.callout}</p>
    <div class="meta-row">${SITE.meta.map(m => `<span>${m}</span>`).join("")}</div>
  </section>
  <section id="news"><h2>Latest News</h2>
    <ul class="news">${SITE.news.map(n => `<li class="reveal"><span class="dt">${n.d}</span><span>${n.t}</span></li>`).join("")}</ul>
  </section>
  <section id="experience"><h2>Research Experience</h2>
    <ul class="tl">${SITE.experience.map(e => `<li class="reveal"><div class="when">${e.w}</div><div class="org">${e.org}</div><div class="pos">${e.pos}</div><div class="note">${e.note}</div></li>`).join("")}</ul>
  </section>
  <section id="publications"><h2>Publications</h2>
    <div class="chips">${CATS.map(([k,l],i) => `<button type="button" data-k="${k}" class="${i?"":"on"}">${l}</button>`).join("")}</div>
    <p class="note-eq">* equal contribution · † corresponding author</p>
    <div id="pubs">${SITE.publications.map(pubCard).join("")}</div>
  </section>
  <section id="patents"><h2>Patents &amp; Books</h2>${list(SITE.booksPatents)}</section>
  <section id="awards"><h2>Honors &amp; Awards</h2>${list(SITE.honors)}</section>
  <section id="teaching"><h2>Teaching</h2>${list(SITE.teaching)}</section>`;
document.getElementById("foot").textContent = SITE.footer;

document.querySelectorAll(".chips button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".chips button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll("#pubs .pub").forEach(p => {
    p.style.display = (b.dataset.k === "all" || p.dataset.cat === b.dataset.k) ? "" : "none";
  });
}));
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }),
                                    { threshold: 0.08 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
</script>
</body>
</html>
