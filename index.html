<style>

    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--body);font:400 15px/1.65 var(--sans);-webkit-font-smoothing:antialiased;overflow-wrap:anywhere;}
  a{color:var(--blue);text-decoration:none;}
  a:hover{text-decoration:underline;text-underline-offset:2px;}
  b,strong{color:var(--ink);font-weight:600;}

  /* sidebar */

        overflow-y:auto;padding:48px 26px 30px;}
  .avatar{width:148px;height:148px;border-radius:50%;overflow:hidden;margin:0 auto 16px;border:3px solid #fff;
          box-shadow:0 2px 12px rgba(20,33,61,.12);background:#dde4ee;}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .who{text-align:center;}
  .who h1{margin:0;font-size:22px;color:var(--ink);font-weight:700;letter-spacing:-.2px;}
  .who .pos{color:var(--muted);font-size:14px;margin-top:2px;}
  .who .aff{font-weight:600;color:var(--navy);font-size:13.5px;margin-top:4px;line-height:1.45;}
  .who .lab{font-size:13px;margin-top:3px;}
  .who .lab a{color:var(--blue);font-weight:600;}
  .who .topic{font-size:13.5px;margin:14px 0 0;}
  .mail{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600;color:var(--navy);margin:0 0 14px;}
  .mail svg{width:15px;height:15px;fill:var(--navy);flex:none;}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:13px;
         padding:8px 14px;border-radius:7px;opacity:0;pointer-events:none;transition:opacity .2s;}

  .icons{display:flex;justify-content:center;gap:8px;margin:18px 0 16px;}
  .icons a{width:34px;height:34px;border:1px solid var(--side-line);border-radius:8px;background:#fff;display:grid;place-items:center;}
  .icons a:hover{border-color:var(--navy);text-decoration:none;}
  .icons svg{width:16px;height:16px;fill:var(--navy);}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:9px 12px;border-radius:7px;
       font-weight:600;font-size:13.5px;margin-bottom:8px;}
  .btn svg{width:15px;height:15px;}
  .btn.dark{background:var(--navy);color:#fff;} .btn.dark svg{fill:#fff;}
  .btn.light{background:#fff;color:var(--navy);border:1px solid var(--side-line);} .btn.light svg{fill:var(--navy);}
  .btn:hover{text-decoration:none;filter:brightness(1.08);}
  .side-h{font-size:11.5px;font-weight:700;letter-spacing:1.2px;color:var(--navy);margin:26px 0 10px;border-top:1px solid var(--side-line);padding-top:18px;}
  .edu{margin:0 0 12px;}
  .edu .d{font-weight:600;color:var(--ink);font-size:13px;line-height:1.4;}
  .edu .o{font-size:12.5px;} .edu .w{font-size:12px;color:var(--muted);}
  .edu .x{font-size:12px;line-height:1.5;margin-top:4px;color:var(--body);}

  /* main */
  main{margin-left:290px;padding:56px 60px 70px;max-width:1010px;}
  section{margin-bottom:44px;}
  h2{display:flex;align-items:center;gap:14px;font-size:21px;color:var(--ink);margin:0 0 16px;font-weight:700;}
  h2::after{content:"";flex:1;height:1px;background:var(--line);}
  p{margin:0 0 12px;}
  .seek{display:inline-block;margin-top:2px;padding:8px 14px;border-radius:8px;background:var(--soft);border:1px solid var(--soft-line);
        color:var(--navy);font-size:14.5px;}

  .news{list-style:none;margin:0;padding:0;}
  .news li{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);}
  .news .dt{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;padding-top:2px;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px;}
  .chips button{font:600 12.5px var(--sans);padding:5px 13px;border-radius:999px;border:1px solid var(--side-line);
                background:#fff;color:var(--body);cursor:pointer;}
  .chips button.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .note-eq{font-size:12.5px;color:var(--muted);margin:0 0 14px;}
  .sub{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin:22px 0 10px;}
  .pub{padding:13px 16px;border-radius:8px;margin-bottom:6px;}
  .pub.key{background:var(--soft);}
  .pub h3{margin:0 0 3px;font-size:15px;line-height:1.45;font-weight:600;color:var(--ink);}
  .pub h3 a{color:var(--ink);} .pub h3 a:hover{color:var(--blue);}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:5px;}
  .lk{font-size:13px;font-weight:600;}
  .venue,.role{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.3px;border-radius:5px;padding:2px 8px;}
  .venue{background:var(--chip);color:var(--navy);}
  .role{background:var(--navy);color:#fff;}
  .authors{font-size:13.5px;}
  .authors .me{font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:2px;}

  .awards{list-style:none;margin:0;padding:0;}
  .awards li{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);}
  .awards .dt{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.6px;padding-top:2px;}
  footer{margin-left:290px;padding:22px 60px 40px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);}

  .reveal{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease;}
  .reveal.in{opacity:1;transform:none;}
  .top{position:fixed;right:22px;bottom:22px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
       background:#fff;display:grid;place-items:center;color:var(--navy);font-size:18px;box-shadow:0 2px 8px rgba(20,33,61,.1);}
  .top:hover{text-decoration:none;}

  @media (max-width: 900px){
    aside{position:static;width:auto;border-right:none;border-bottom:1px solid var(--side-line);padding:32px 22px;}
    main,footer{margin-left:0;padding:32px 20px;}
    .news li,.awards li{grid-template-columns:76px 1fr;}
  }
  @media (prefers-reduced-motion: reduce){ .reveal{opacity:1;transform:none;transition:none;} html{scroll-behavior:auto;} }
</style>

  document.querySelectorAll(".chips button").forEach(x => x.classList.toggle("on", x === b));
  const k = b.dataset.k;
  document.querySelectorAll("#pubs .pub").forEach(p => { p.style.display = (k === "all" || p.dataset.topic === k) ? "" : "none"; });
  const anyAbs = [...document.querySelectorAll('#pubs .pub')].some(p => abstracts.some(a => p.querySelector("h3").innerHTML === a.title) && p.style.display !== "none");
  document.querySelector("[data-sub]").style.display = anyAbs ? "" : "none";
}));
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }),
                                    { threshold: 0.08 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
</script>
</body>
